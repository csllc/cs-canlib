# Temporary: check that the Kvaser CANlib SDK can be downloaded and installed
# silently on a GitHub Windows runner. Run it from the Actions tab
# ("Run workflow"), then delete this file.

name: Kvaser SDK test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned SDK version, matching the headers and import library currently in
  # ext/canlib-win32-x64 (CANlib 5.33, May 2020). The MD5 is the one Kvaser
  # publishes on the SDK download page.
  CANLIB_SDK_VERSION: 5.33.212
  CANLIB_SDK_FILE: canlib_5_33_212.exe
  CANLIB_SDK_MD5: ae51beb2147e328797a1b27459b014b6

jobs:
  test:
    runs-on: windows-2025
    steps:
      - name: Download CANlib SDK
        shell: pwsh
        run: |
          $url = "https://pim.kvaser.com/var/assets/Product_Resources/7330130980150/$env:CANLIB_SDK_VERSION/$env:CANLIB_SDK_FILE"
          Invoke-WebRequest -Uri $url -OutFile $env:CANLIB_SDK_FILE
          Get-Item $env:CANLIB_SDK_FILE | Format-List Name, Length
          $md5 = (Get-FileHash $env:CANLIB_SDK_FILE -Algorithm MD5).Hash.ToLower()
          $sha256 = (Get-FileHash $env:CANLIB_SDK_FILE -Algorithm SHA256).Hash.ToLower()
          Write-Host "MD5:    $md5"
          Write-Host "SHA256: $sha256"
          if ($md5 -ne $env:CANLIB_SDK_MD5) { throw "MD5 mismatch: expected $env:CANLIB_SDK_MD5" }

      - name: Install CANlib SDK (silent)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\canlib-sdk"
          # NSIS installer: /S = silent, /D= = install folder (must be last)
          $p = Start-Process -FilePath ".\$env:CANLIB_SDK_FILE" -ArgumentList "/S", "/D=$dir" -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Installer failed" }
          Get-ChildItem "$dir\INC\canlib.h", "$dir\INC\canstat.h", "$dir\Lib\x64\canlib32.lib" | Format-Table Length, FullName

      # Fallback if the silent install misbehaves: NSIS installers can also be
      # unpacked with 7-Zip, which is preinstalled on the runner
      - name: Extract CANlib SDK with 7-Zip (fallback check)
        if: always()
        shell: pwsh
        run: |
          7z x $env:CANLIB_SDK_FILE "-o$env:RUNNER_TEMP\canlib-7z" -y | Out-Null
          Get-ChildItem "$env:RUNNER_TEMP\canlib-7z" -Recurse -Include canlib.h, canstat.h, canlib32.lib |
            Format-Table Length, FullName
